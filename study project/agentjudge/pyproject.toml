[project]
name = "agentjudge"
version = "0.1.0"
description = "AgentJudge: mock-first eval harness + CI quality gate (synthetic data only, offline)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.19",
    "httpx>=0.28",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
agentjudge = "agentjudge.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentjudge"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agentjudge"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
