[project]
name = "opscopilot"
version = "0.1.0"
description = "OpsCopilot P1 mock-first vertical slice: RAG over synthetic KEDB/SOP with hybrid retrieval (offline, no API keys)"
readme = "README.md"
authors = [
    { name = "manojastro" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
opscopilot = "opscopilot:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opscopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# generate_corpus.py is mostly long synthetic article strings (data, not logic).
"scripts/generate_corpus.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
show_error_codes = true
files = "src"
