# P1 mock-first: app only (in-memory retrieval, no DB).
# Later milestones add: postgres/pgvector service + Langfuse.
name: opscopilot-p1

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      OPS_CORPUS_DIR: data/corpus
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

