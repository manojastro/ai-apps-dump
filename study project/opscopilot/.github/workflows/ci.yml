name: ci

on:
  push:
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dev deps
        run: uv sync --group dev --frozen

      - name: Generate corpus
        run: uv run --no-sync python scripts/generate_corpus.py

      - name: Ruff
        run: uv run --no-sync ruff check src scripts tests

      - name: Mypy (strict on src/)
        run: uv run --no-sync mypy src

      - name: Pytest
        run: uv run --no-sync python -m pytest -q

      - name: Smoke eval
        run: uv run --no-sync python scripts/smoke_eval.py
