<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  color-scheme: dark;
  --ground:#0c0f14; --panel:#12171e; --raised:#18202a; --line:#232c38; --line-2:#2f3a48;
  --ink:#e6eaf0; --ink-2:#a3adbb; --ink-3:#727d8d;
  --indigo:#8d95ff; --indigo-soft:rgba(141,149,255,.14);
  --cyan:#43cfe0; --cyan-soft:rgba(67,207,224,.13);
  --emerald:#3ad29f; --emerald-soft:rgba(58,210,159,.13);
  --amber:#f0b54a; --amber-soft:rgba(240,181,74,.13);
  --rose:#f27a8e; --rose-soft:rgba(242,122,142,.14);
  --display:"Archivo", "Arial Narrow", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r:6px;
}
*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--ink)}
body{font:15px/1.55 var(--body);margin:0}
.wrap{max-width:1320px;margin:0 auto;padding-inline:clamp(16px,3vw,40px)}
a{color:var(--indigo)}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--mono)}
.label{font:500 11px/1.2 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}

/* masthead */
.masthead{border-bottom:1px solid var(--line);padding-block:28px 22px}
.mast-grid{display:flex;flex-wrap:wrap;gap:18px 40px;align-items:flex-end;justify-content:space-between}
.mast-grid h1{font-size:clamp(30px,4.4vw,48px);font-weight:750;font-stretch:118%;letter-spacing:-.01em;line-height:1.02}
.mast-grid h1 span{color:var(--emerald)}
.thesis{max-width:62ch;color:var(--ink-2);margin:10px 0 0}
.mast-meta{display:grid;grid-template-columns:auto auto;gap:4px 18px;font:13px/1.5 var(--mono);color:var(--ink-2)}
.mast-meta b{color:var(--ink);font-weight:500}

/* tabs */
.tabs{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--ground) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tablist{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;padding-block:8px}
.tab{appearance:none;border:0;background:none;color:var(--ink-2);font:500 14px/1 var(--body);padding:10px 12px;border-radius:var(--r);white-space:nowrap;cursor:pointer;display:flex;gap:8px;align-items:center}
.tab:hover{background:var(--raised);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--indigo-soft);color:var(--ink);box-shadow:inset 0 -2px 0 var(--indigo)}
.tab .n{font:500 11px/1 var(--mono);color:var(--ink-3);background:var(--raised);padding:3px 6px;border-radius:4px}
.tab[aria-selected="true"] .n{color:var(--indigo);background:transparent}

main{padding-block:28px 64px}
section.panel-view{display:grid;gap:28px}
.view-head{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;justify-content:space-between}
.view-head h2{font-size:26px;font-weight:700;font-stretch:112%}
.view-head p{margin:6px 0 0;color:var(--ink-2);max-width:72ch}

/* generic blocks */
.block{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.block > h3{font-size:15px;font-weight:650;font-stretch:108%;margin-bottom:14px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:20px}
.note{color:var(--ink-2);font-size:13.5px;max-width:78ch}
.callout{border:1px dashed var(--line-2);border-radius:var(--r);padding:14px 16px;color:var(--ink-2);font-size:14px}
.callout b{color:var(--ink)}

/* readiness */
.score-row{display:flex;flex-wrap:wrap;gap:20px 36px;align-items:flex-end;margin-bottom:18px}
.score{font:750 76px/0.9 var(--display);font-stretch:120%;color:var(--ink)}
.score small{font:500 18px var(--mono);color:var(--ink-3);margin-left:4px}
.score-cap{color:var(--ink-2);font-size:13.5px;max-width:40ch}
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(120px,1.1fr) 46px minmax(90px,2fr) 38px;gap:12px;align-items:center;font-size:13.5px}
.bar-row .w{font:500 12px var(--mono);color:var(--ink-3)}
.track{height:8px;background:var(--raised);border-radius:4px;position:relative;overflow:hidden;border:1px solid var(--line)}
.fill{position:absolute;inset:0 auto 0 0;background:var(--emerald);border-radius:4px}
.fill.cyan{background:var(--cyan)} .fill.amber{background:var(--amber)} .fill.indigo{background:var(--indigo)}
.bar-row .v{font:600 13px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.axis{display:grid;grid-template-columns:minmax(120px,1.1fr) 46px minmax(90px,2fr) 38px;gap:12px;font:11px var(--mono);color:var(--ink-3)}
.axis .ticks{display:flex;justify-content:space-between}

/* actions */
.action{display:grid;grid-template-columns:28px 1fr 64px;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.action:first-of-type{border-top:0}
.action .rk{font:700 20px/1 var(--display);color:var(--indigo)}
.action .dl{font:600 20px/1 var(--mono);color:var(--emerald);text-align:right}
.action p{margin:4px 0 0;color:var(--ink-2);font-size:13px}

/* counts */
.counts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.count{background:var(--panel);padding:14px 16px;display:grid;gap:4px;cursor:pointer;text-align:left;border:0;color:inherit;font:inherit}
.count:hover{background:var(--raised)}
.count .big{font:700 28px/1 var(--display);font-stretch:112%;font-variant-numeric:tabular-nums}
.count .sub{font:12px var(--mono);color:var(--ink-3)}
.count .sub .lo{color:var(--amber)} .count .sub .cf{color:var(--rose)}

/* lists */
ol.insights{margin:0;padding-left:20px;display:grid;gap:10px;color:var(--ink-2)}
ol.insights li::marker{color:var(--emerald);font-family:var(--mono)}

/* ticket queue */
.ticket{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:12px 0;border-top:1px solid var(--line)}
.ticket:first-of-type{border-top:0}
.prio{font:600 11px/1 var(--mono);padding:5px 7px;border-radius:4px;letter-spacing:.04em;align-self:start}
.prio.P1{background:var(--rose-soft);color:var(--rose);box-shadow:inset 0 0 0 1px rgba(242,122,142,.35)}
.prio.P2{background:var(--amber-soft);color:var(--amber);box-shadow:inset 0 0 0 1px rgba(240,181,74,.3)}
.prio.P3{background:var(--raised);color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line-2)}
.ticket .t{font-weight:600}
.ticket .meta{grid-column:2;color:var(--ink-2);font-size:13px}
.sides{grid-column:2;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:8px;margin-top:6px}
.side{background:var(--raised);border:1px solid var(--line);border-radius:5px;padding:8px 10px;font-size:13px;color:var(--ink-2)}
.side .label{display:block;margin-bottom:4px}

/* table toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{background:var(--raised);color:var(--ink);border:1px solid var(--line-2);border-radius:5px;font:13px var(--body);padding:7px 10px;min-width:0}
.toolbar input{flex:1 1 220px;max-width:340px}
.toolbar .shown{margin-left:auto;font:12px var(--mono);color:var(--ink-3)}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
thead th{position:sticky;top:0;background:var(--raised);text-align:left;font:500 11px/1.2 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:10px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:var(--ink)}
thead th[aria-sort="ascending"]::after{content:" ↑";color:var(--indigo)}
thead th[aria-sort="descending"]::after{content:" ↓";color:var(--indigo)}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-2)}
tbody tr.row{cursor:pointer}
tbody tr.row:hover td{background:rgba(255,255,255,.02)}
tbody tr.row td:first-child{color:var(--ink);font-weight:500;box-shadow:inset 3px 0 0 transparent}
tbody tr.row.low td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
tbody tr.row.conf-cf td:first-child{box-shadow:inset 3px 0 0 var(--rose)}
tbody tr.detail td{background:var(--raised);color:var(--ink-2);font-size:13px}
.detail dl{display:grid;grid-template-columns:minmax(110px,160px) 1fr;gap:6px 16px;margin:0}
.detail dt{font:500 11px/1.6 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.detail dd{margin:0}
.detail ul{margin:0;padding-left:18px}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.wrapcell{min-width:220px;max-width:420px}

/* chips */
.chip{display:inline-block;font:500 11px/1 var(--mono);padding:4px 6px;border-radius:4px;margin:0 4px 4px 0;white-space:nowrap;background:var(--raised);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.chip.HIGH{color:var(--emerald);box-shadow:inset 0 0 0 1px rgba(58,210,159,.4)}
.chip.MEDIUM{color:var(--cyan);box-shadow:inset 0 0 0 1px rgba(67,207,224,.35)}
.chip.LOW{color:#141007;background:var(--amber);box-shadow:none;font-weight:600}
.chip.unverified{color:var(--amber);box-shadow:none;border:1px dashed var(--amber);background:transparent}
.chip.conflict{color:var(--rose);background:var(--rose-soft);box-shadow:inset 0 0 0 1px rgba(242,122,142,.4);cursor:pointer}
.chip.needs{color:var(--indigo);background:var(--indigo-soft);box-shadow:none}
button.chip{border:0;cursor:pointer}
.chip.partial{color:#141007;background:var(--amber);box-shadow:none}
.chip.no{color:var(--rose);box-shadow:inset 0 0 0 1px rgba(242,122,142,.4)}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--rose-soft)}100%{background:transparent}}
.strip{display:flex;flex-wrap:wrap;gap:8px 28px;font:13px var(--mono);color:var(--ink-2)}
.strip b{color:var(--ink);font:600 15px var(--mono);margin-right:4px}
.chip.st-ok{color:var(--emerald)} .chip.st-mid{color:var(--cyan)} .chip.st-none{color:var(--ink-3)}
.meter{display:inline-flex;gap:2px;vertical-align:middle}
.meter i{width:7px;height:10px;border-radius:2px;background:var(--line-2)}
.meter i.on{background:var(--emerald)}
.pbar{display:flex;align-items:center;gap:8px}
.pbar .track{width:84px;flex:none}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px;color:var(--ink-3)}
footer{border-top:1px solid var(--line);padding-block:20px 40px;color:var(--ink-3);font-size:12.5px}
@media (max-width:860px){ .counts{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:640px){
  .bar-row,.axis{grid-template-columns:1fr 40px 34px}
  .bar-row .track,.axis .ticks{grid-column:1 / -1;order:3}
  .score{font-size:60px}
}
@media (prefers-reduced-motion:no-preference){ .fill{transition:width .5s ease} }
</style>

<script>(() => {
const D = JSON.parse(document.getElementById("data").textContent);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const conf1 = c => (String(c || "").match(/HIGH|MEDIUM|LOW/) || ["—"])[0];
const confChip = c => `<span class="chip ${conf1(c)}" title="${esc(c)}">${conf1(c)}</span>`;
const flagChips = fl => (fl || []).map(f => {
  if (f.startsWith("conflict:")) { const id = f.split(":")[1]; return `<button class="chip conflict" data-conf="${id}" title="Open conflict ${id}">${id}</button>`; }
  if (f === "unverified") return `<span class="chip unverified">unverified</span>`;
  if (f === "needs-input") return `<span class="chip needs">needs input</span>`;
  return `<span class="chip">${esc(f.replace(/-/g, " "))}</span>`;
}).join("");
const refChips = s => String(s || "").split(/,\s*/).filter(x => /^C\d+$/.test(x)).map(id => `<button class="chip conflict" data-conf="${id}">${id}</button>`).join("") || esc(s);
const rowCls = r => conf1(r.confidence) === "LOW" ? "low" : ((r.flags || []).some(f => f.startsWith("conflict")) ? "conf-cf" : "");
const statusChip = s => { const cls = /Deployed|Certified|Interview Ready|ACTIVE|LIVE/.test(s) ? "st-ok" : /Practiced|Building|Upcoming|LIKELY/.test(s) ? "st-mid" : "st-none"; return `<span class="chip ${cls}">${esc(s)}</span>`; };
const dl = pairs => `<dl>${pairs.filter(([, v]) => v !== undefined && v !== null && v !== "" && !(Array.isArray(v) && !v.length))
  .map(([k, v]) => `<dt>${esc(k)}</dt><dd>${Array.isArray(v) ? `<ul>${v.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : esc(v)}</dd>`).join("")}</dl>`;
const stripTags = s => String(s).replace(/<[^>]*>/g, "");

function makeTable(host, cfg) {
  const { id, rows, cols, filters = [], detail, sort } = cfg;
  rows.forEach((r, i) => { r.__i = i; r.__s = JSON.stringify(r).toLowerCase(); });
  const st = { q: "", f: filters.map(() => ""), sk: sort ? sort.key : null, sd: sort ? sort.dir : 1, open: new Set() };
  const vals = f => [...new Set(rows.flatMap(r => { const v = f.get(r); return Array.isArray(v) ? v : [v]; }).filter(v => v !== "" && v != null))].sort((a, b) => String(a).localeCompare(String(b), undefined, { numeric: true }));
  host.innerHTML = `<div class="toolbar"><input type="search" id="${id}-q" placeholder="Search this table" aria-label="Search this table">
    ${filters.map((f, i) => `<select id="${id}-f${i}" aria-label="${esc(f.label)}"><option value="">${esc(f.label)}: all</option>${vals(f).map(v => `<option>${esc(v)}</option>`).join("")}</select>`).join("")}
    <span class="shown" id="${id}-n"></span></div>
    <div class="tscroll"><table><thead><tr>${cols.map((c, i) => `<th data-i="${i}" scope="col" tabindex="0">${esc(c.label)}</th>`).join("")}</tr></thead><tbody></tbody></table></div>`;
  const tbody = host.querySelector("tbody"), ths = [...host.querySelectorAll("th")];
  const sv = (c, r) => c.sortVal ? c.sortVal(r) : stripTags(c.render ? c.render(r) : r[c.key] ?? "");
  function draw() {
    let list = rows.filter(r => (!st.q || r.__s.includes(st.q)) && filters.every((f, i) => { if (!st.f[i]) return true; const v = f.get(r); return Array.isArray(v) ? v.includes(st.f[i]) : String(v) === st.f[i]; }));
    if (st.sk !== null) { const c = cols[st.sk]; list = [...list].sort((a, b) => { const x = sv(c, a), y = sv(c, b); return (typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y), undefined, { numeric: true })) * st.sd; }); }
    ths.forEach((t, i) => t.setAttribute("aria-sort", i === st.sk ? (st.sd > 0 ? "ascending" : "descending") : "none"));
    tbody.innerHTML = list.map(r => `<tr class="row ${rowCls(r)}" data-k="${r.__i}" tabindex="0" aria-expanded="${st.open.has(r.__i)}">${cols.map(c => `<td class="${c.cls || ""}">${c.render ? c.render(r) : esc(r[c.key])}</td>`).join("")}</tr>` +
      (st.open.has(r.__i) && detail ? `<tr class="detail"><td colspan="${cols.length}">${detail(r)}</td></tr>` : "")).join("") ||
      `<tr><td colspan="${cols.length}">No rows match these filters.</td></tr>`;
    host.querySelector(`#${id}-n`).textContent = `Showing ${list.length} of ${rows.length}`;
  }
  host.querySelector(`#${id}-q`).addEventListener("input", e => { st.q = e.target.value.trim().toLowerCase(); draw(); });
  filters.forEach((f, i) => host.querySelector(`#${id}-f${i}`).addEventListener("change", e => { st.f[i] = e.target.value; draw(); }));
  const sortBy = i => { st.sd = st.sk === i ? -st.sd : 1; st.sk = i; draw(); };
  ths.forEach((t, i) => { t.addEventListener("click", () => sortBy(i)); t.addEventListener("keydown", e => { if (e.key === "Enter") sortBy(i); }); });
  const toggle = tr => { const k = +tr.dataset.k; st.open.has(k) ? st.open.delete(k) : st.open.add(k); draw(); };
  tbody.addEventListener("click", e => { if (e.target.closest("button,a")) return; const tr = e.target.closest("tr.row"); if (tr && detail) toggle(tr); });
  tbody.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("tr.row") && detail) toggle(e.target); });
  draw();
}

const R = D.readiness, E = R.evidence_only;
const bar = (label, w, v, cls = "") => `<div class="bar-row"><span>${esc(label)}</span><span class="w">${w}</span><div class="track" role="img" aria-label="${esc(label)} ${v} of 100"><div class="fill ${cls}" style="width:${v}%"></div></div><span class="v">${v}</span></div>`;
const axis = `<div class="axis" aria-hidden="true"><span></span><span></span><div class="ticks"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div><span></span></div>`;
const pct = x => `${Math.round(x * 100)}%`;

const VIEWS = {
  dashboard(el) {
    const C = D.counts, tile = (tab, big, lbl, c) => `<button class="count" data-go="${tab}"><span class="label">${lbl}</span><span class="big">${big}</span><span class="sub">${c ? `<span class="lo">${c.low || 0} LOW</span> · ${c.unverified || 0} unverified · <span class="cf">${c.conflict || 0} conflict</span>` : "&nbsp;"}</span></button>`;
    const pr = { P1: 0, P2: 0, P3: 0 }; D.conflicts.forEach(c => pr[c.priority]++);
    el.innerHTML = `<div class="view-head"><div><h2>Dashboard</h2><p>Summary first: the readiness score from the app's locked formula, what would move it, and the decisions only you can make.</p></div>
      <div class="legend"><span class="chip LOW">LOW</span> weak source <span class="chip unverified">unverified</span> claim without proof <button class="chip conflict" data-conf="C1">C1</button> open conflict <span class="chip needs">needs input</span></div></div>
    <div class="grid-2">
      <div class="block"><h3>Readiness score <span class="label">locked formula</span></h3>
        <div class="score-row"><div class="score">${E.overall}<small>/100</small></div><p class="score-cap">Evidence-only. No AI skill, project, story, contact, application or certificate is evidenced in the 180 files, so every pillar reads 0.</p></div>
        <div class="bars">${bar("Skills", "25%", E.skills)}${bar("Portfolio", "30%", E.portfolio)}${bar("Interview stories", "15%", E.stories)}${bar("Networking & pipeline", "15%", E.net_pipe)}${bar("Certifications", "15%", E.certs)}${axis}</div>
        <h3 style="margin-top:22px">Same formula, different inputs</h3>
        <div class="bars">${bar("Evidence only (headline)", "", E.overall)}${bar("Counting self-reported ops skills", "", R.self_reported.overall, "cyan")}${bar("If 69 research targets were imported as “Identified” (inflation, not progress)", "", R.if_targets_imported.overall, "amber")}${bar("After next actions 1–3", "", R.all_three_actions.overall, "indigo")}${axis}</div>
        <p class="note" style="margin-top:12px">${esc(R.formula)}</p></div>
      <div class="block"><h3>Next 3 actions, ranked by score impact <span class="label">from 0</span></h3>
        ${D.actions.map(a => `<div class="action"><span class="rk">${a.rank}</span><div>${esc(a.action)}<p>${esc(a.detail)}</p></div><span class="dl">+${a.delta}</span></div>`).join("")}
        <div class="action"><span class="rk" style="color:var(--ink-3)">·</span><div>${esc(D.cert_action.action)}<p>${esc(D.cert_action.detail)}</p></div><span class="dl" style="color:var(--ink-3)">+${D.cert_action.delta}</span></div>
        <p class="note">Together, actions 1–3 take the score to ${R.all_three_actions.overall}/100. Assumptions: ${esc(R.assumptions.join(" "))}</p></div>
    </div>
    <div class="counts">${tile("skilling", D.skills.length, "Skills", C.skills)}${tile("portfolio", D.projects.length, "Projects", C.projects)}${tile("jobs", D.pipeline.length, "Job targets · 0 applied", C.pipeline)}
      ${tile("certs", D.certifications.length, "Certifications", C.certifications)}${tile("stories", D.stories.length, "STAR slots · 0 ready", C.stories)}${tile("network", D.networking.length, "Networking · 0 contacts", C.networking)}
      ${tile("research", D.research.length, "Research topics", C.research)}${tile("roles", D.compensation.length, "Comp data points", C.compensation)}${tile("dashboard", D.conflicts.length, "Conflicts", null)}${tile("dashboard", D.decisions.length, "Open decisions", null)}</div>
    <div class="grid-2">
      <div class="block"><h3>Top 5 insights</h3><ol class="insights">${D.insights.map(i => `<li>${esc(i)}</li>`).join("")}</ol></div>
      <div class="block"><h3>Biggest gaps <span class="label">what a recruiter will ask</span></h3>${D.gaps.map((g, i) => `<div class="ticket"><span class="prio P1">GAP-${i + 1}</span><span>${esc(g)}</span></div>`).join("")}</div>
    </div>
    <div class="block" id="queue"><h3>Decision queue — ${D.conflicts.length} conflicts <span class="label">${pr.P1} P1 · ${pr.P2} P2 · ${pr.P3} P3 · never averaged</span></h3>
      <div class="toolbar"><select id="q-prio" aria-label="Priority"><option value="">Priority: all</option><option>P1</option><option>P2</option><option>P3</option></select></div>
      <div id="q-list"></div></div>
    <div class="block"><h3>Open decisions</h3><div id="t-dec"></div></div>
    <div class="block"><h3>Compensation snapshot <span class="label">your baseline & targets</span></h3><div id="t-compsnap"></div></div>`;
    const drawQ = p => el.querySelector("#q-list").innerHTML = D.conflicts.filter(c => !p || c.priority === p).map(c => `<div class="ticket" id="conf-${c.id}"><span class="prio ${c.priority}">${c.priority} · ${c.id}</span><span class="t">${esc(c.topic)}</span>
      <div class="sides"><div class="side"><span class="label">Side A</span>${esc(c.side_a)}</div><div class="side"><span class="label">Side B</span>${esc(c.side_b)}</div>${c.other ? `<div class="side"><span class="label">Also</span>${esc(c.other)}</div>` : ""}</div>
      <div class="meta">Affects: ${esc(c.affects)} · Decide: <b>${esc(c.decision_needed)}</b></div></div>`).join("");
    drawQ(""); el.querySelector("#q-prio").addEventListener("change", e => drawQ(e.target.value));
    makeTable(el.querySelector("#t-dec"), { id: "dec", rows: D.decisions, cols: [
      { key: "id", label: "ID", cls: "num" }, { key: "decision", label: "Decision", cls: "wrapcell" }, { key: "options", label: "Options", cls: "wrapcell" },
      { key: "conflicts", label: "Conflicts", render: r => refChips(r.conflicts) }, { key: "readiness_impact", label: "Readiness impact", cls: "wrapcell" }, { key: "blocking", label: "When" }] });
    makeTable(el.querySelector("#t-compsnap"), { id: "cs", rows: D.compensation.filter(c => /Your (baseline|target)/.test(c.category)), cols: compCols(),
      detail: r => dl([["Why it matters", r.why], ["Sources", r.sources]]) });
  },
  skilling(el) {
    const t = D.skills.filter(s => s.kind === "target").length, tr = D.skills.length - t, pr = D.skills.filter(s => s.status === "Practiced").length;
    el.innerHTML = head("Skilling", `${t} target AI skills, all Not Started because no evidence exists; ${tr} transferable ops skills, ${pr} self-reported as Practiced and still unverified. JD signal = % of 312 India JDs / % must-have in 52 full-body JDs.`) + `<div class="block" id="t"></div>`;
    makeTable(el.querySelector("#t"), { id: "sk", rows: D.skills, sort: { key: 0, dir: 1 }, cols: [
      { key: "name", label: "Skill", cls: "wrapcell" }, { key: "kind", label: "Type" }, { key: "module", label: "App module" }, { key: "status", label: "Level", render: r => statusChip(r.status) },
      { key: "jd_signal", label: "JD signal", cls: "num" }, { key: "priority", label: "Priority" }, { key: "confidence", label: "Confidence", render: r => confChip(r.confidence), sortVal: r => "HML".indexOf(conf1(r.confidence)[0]) },
      { key: "flags", label: "Flags", render: r => flagChips(r.flags) }, { key: "why", label: "Why this matters for hiring", cls: "wrapcell" }],
      filters: [{ label: "Type", get: r => r.kind }, { label: "Priority", get: r => r.priority }, { label: "Confidence", get: r => conf1(r.confidence) }, { label: "Flag", get: r => r.flags }],
      detail: r => dl([["Level", r.level], ["Evidence", r.evidence], ["Maps to app item", r.seed_item], ["Sources", r.sources]]) });
  },
  portfolio(el) {
    el.innerHTML = head("Portfolio", "Twelve canonical builds after merging nine competing lists (conflict C4). Ordered by build stage, then the consensus sequence. Only SpendLens has code.") +
      `<p class="callout">${esc(D.meta.seed_note)}</p><div class="block" id="t"></div>`;
    makeTable(el.querySelector("#t"), { id: "pj", rows: D.projects, sort: { key: 0, dir: 1 }, cols: [
      { key: "order", label: "#", cls: "num", sortVal: r => r.order }, { key: "name", label: "Project", cls: "wrapcell" }, { key: "status", label: "Status", render: r => statusChip(r.status) },
      { key: "completion", label: "Completion", sortVal: r => r.completion, render: r => `<span class="pbar"><span class="track"><span class="fill" style="width:${r.completion}%"></span></span><span class="mono">${r.completion}%</span></span>` },
      { key: "technologies", label: "Stack", cls: "wrapcell", render: r => r.technologies.slice(0, 5).map(x => `<span class="chip">${esc(x)}</span>`).join("") },
      { key: "whats_left", label: "What's left", cls: "wrapcell" }, { key: "confidence", label: "Confidence", render: r => confChip(r.confidence) }, { key: "flags", label: "Flags", render: r => flagChips(r.flags) },
      { key: "why", label: "Why this matters for hiring", cls: "wrapcell" }],
      filters: [{ label: "Status", get: r => r.status }, { label: "Confidence", get: r => conf1(r.confidence) }, { label: "Flag", get: r => r.flags }],
      detail: r => dl([["Description", r.description], ["Completion note", r.completion_note], ["Merged from", r.merged_from], ["Sources", r.sources]]) });
  },
  roles(el) {
    el.innerHTML = head("Roles Matrix", "Nine target roles scored by every source that scored them, side by side — the disagreement is the point (conflict C1). Pay is India LPA.") +
      `<div class="block" id="t"></div><div class="block"><h3>Column sources</h3><div class="note">${Object.entries(D.meta.role_sources).map(([k, v]) => `<span class="chip">${esc(k)}</span> ${esc(v)}`).join(" &nbsp; ")}</div></div>
      <div class="view-head"><div><h2>Compensation evidence</h2><p>${D.compensation.length} curated data points, each with source and date. Board estimates are never mixed with disclosed pay. The Excel workbook also carries all 1,902 raw salary mentions.</p></div></div><div class="block" id="t2"></div>`;
    const n = r => typeof r === "number" ? r : -1;
    makeTable(el.querySelector("#t"), { id: "rm", rows: D.roles, cols: [
      { key: "role", label: "Role", cls: "wrapcell" }, { key: "de_fit", label: "DE fit", cls: "num", sortVal: r => n(r.de_fit) }, { key: "rsr_score", label: "RSR score", cls: "num" },
      { key: "grok_rank", label: "grok" }, { key: "mrr_score", label: "MRR /100", cls: "num", sortVal: r => n(r.mrr_score) }, { key: "jox_jobs", label: "Jobs (312)", cls: "num", sortVal: r => n(r.jox_jobs) },
      { key: "jox_tier_a", label: "Tier A", cls: "num", sortVal: r => n(r.jox_tier_a) }, { key: "jox_median_fit", label: "Median fit", cls: "num", sortVal: r => n(r.jox_median_fit) },
      { key: "jox_difficulty", label: "Difficulty", cls: "num", sortVal: r => n(r.jox_difficulty) }, { key: "trend", label: "Trend" }, { key: "x_proxy", label: "X share", cls: "num" },
      { key: "arm_median", label: "Median LPA (ARM)", cls: "num" }, { key: "skm_levels", label: "Level bands (SKM)", cls: "wrapcell" }, { key: "openings_est", label: "Openings est.", cls: "num" },
      { key: "service_desk_path", label: "From service desk", cls: "wrapcell" }, { key: "horizon", label: "Horizon" }],
      detail: r => dl([["Percentiles 25/50/75/90 (ARM)", r.arm_percentiles], ["Active jobs", String(r.jox_active)]]) });
    makeTable(el.querySelector("#t2"), { id: "cp", rows: D.compensation, cols: compCols(), filters: [{ label: "Category", get: r => r.category }, { label: "Confidence", get: r => conf1(r.confidence) }, { label: "Flag", get: r => r.flags }],
      detail: r => dl([["Why it matters", r.why], ["Sources", r.sources]]) });
  },
  jobs(el) {
    const P = D.pipeline, cos = new Set(P.map(p => p.company.toLowerCase())).size, tiers = {}; P.forEach(p => tiers[p.tier] = (tiers[p.tier] || 0) + 1);
    el.innerHTML = head("Job Search", "No application exists in any file. Every row is a research-identified target at stage “Identified”, with the date of the source that found it.") +
      `<div class="strip"><span><b>${P.length}</b>targets</span><span><b>${cos}</b>companies</span><span><b>0</b>applied</span>${Object.entries(tiers).map(([k, v]) => `<span><b>${v}</b>${esc(k)}</span>`).join("")}</div>
      <p class="callout"><b>Decision D11:</b> importing these as “Identified” applications would lift Networking & Pipeline from 0 to ${D.readiness.if_targets_imported.net_pipe} and the overall score to ${D.readiness.if_targets_imported.overall} without a single application. Keep them as a target list until you actually apply.</p><div class="block" id="t"></div>`;
    const fitv = r => typeof r.fit === "number" ? r.fit : (parseFloat(r.fit) || -1);
    makeTable(el.querySelector("#t"), { id: "jb", rows: P, sort: { key: 5, dir: -1 }, cols: [
      { key: "company", label: "Company", cls: "wrapcell" }, { key: "role", label: "Role", cls: "wrapcell" }, { key: "tier", label: "Tier" }, { key: "location", label: "City" },
      { key: "posting_status", label: "Posting", render: r => statusChip(r.posting_status) }, { key: "fit", label: "Fit", cls: "num", sortVal: fitv }, { key: "track", label: "Track" },
      { key: "identified_date", label: "Source date", cls: "num" }, { key: "status", label: "Stage" }, { key: "confidence", label: "Confidence", render: r => confChip(r.confidence) }, { key: "flags", label: "Flags", render: r => flagChips(r.flags) }],
      filters: [{ label: "Tier", get: r => r.tier }, { label: "Track", get: r => r.track }, { label: "City", get: r => r.location }, { label: "Posting", get: r => r.posting_status }, { label: "Confidence", get: r => conf1(r.confidence) }],
      detail: r => dl([["Why this matters for hiring", r.why], ["Notes", r.notes], ["Pay", r.salaryRange], ["Link", r.jobUrl], ["App tier", r.companyTier], ["Sources", r.sources]]) });
  },
  network(el) {
    el.innerHTML = head("Networking", "No named personal contact, referral or conversation appears in any file. What exists: public communities, upcoming events and an outreach plan that is not yet started.") +
      `<p class="callout"><b>0 contacts · 0 referrals · 0 conversations.</b> The 15-name referral list (A8) and the 30-minute HRBP conversation (RSR) are the first two rows below.</p><div class="block" id="t"></div>`;
    makeTable(el.querySelector("#t"), { id: "nw", rows: D.networking, cols: [
      { key: "kind", label: "Kind" }, { key: "name", label: "Name", cls: "wrapcell" }, { key: "where", label: "Where", cls: "wrapcell" }, { key: "size", label: "Size", cls: "num" },
      { key: "date", label: "Date" }, { key: "status", label: "Status", render: r => statusChip(r.status) }, { key: "action", label: "Next step", cls: "wrapcell" }, { key: "confidence", label: "Confidence", render: r => confChip(r.confidence) }, { key: "flags", label: "Flags", render: r => flagChips(r.flags) }],
      filters: [{ label: "Kind", get: r => r.kind }, { label: "Status", get: r => r.status }],
      detail: r => dl([["Why this matters for hiring", r.why], ["Sources", r.sources]]) });
  },
  certs(el) {
    el.innerHTML = head("Certifications", "None held or in progress; ITIL status unknown. Track A = internal move, Track B = identity change / external search. Track C is named in your brief but defined in no file (conflict C10).") +
      `<p class="callout">${esc(D.meta.cert_cap)}</p><div class="block" id="t"></div>`;
    makeTable(el.querySelector("#t"), { id: "ct", rows: D.certifications, cols: [
      { key: "name", label: "Certification", cls: "wrapcell" }, { key: "provider", label: "Provider" }, { key: "track", label: "Track" }, { key: "priority", label: "Priority" }, { key: "status", label: "Status", render: r => statusChip(r.status) },
      { key: "cost", label: "Cost", cls: "wrapcell" }, { key: "recommendation", label: "Recommendation", cls: "wrapcell" }, { key: "confidence", label: "Confidence", render: r => confChip(r.confidence) }, { key: "flags", label: "Flags", render: r => flagChips(r.flags) }],
      filters: [{ label: "Track", get: r => r.track }, { label: "Category", get: r => r.category }, { label: "Flag", get: r => r.flags }],
      detail: r => dl([["Why this matters for hiring", r.why], ["Prep time", r.prep], ["In app seed", r.in_app_seed ? "yes" : "no"], ["Sources", r.sources]]) });
  },
  stories(el) {
    el.innerHTML = head("Story Bank", "Fifteen story slots seeded from fragments in the research. Every S/T/A/R field is empty — the files hold templates and placeholders, never your real incidents or numbers.") +
      `<p class="callout">${esc(D.meta.story_targets)}</p><div class="block" id="t"></div>`;
    makeTable(el.querySelector("#t"), { id: "st", rows: D.stories, cols: [
      { key: "title", label: "Story", cls: "wrapcell" }, { key: "category", label: "Category" },
      { key: "fields_filled", label: "Fields", render: r => `<span class="meter" aria-label="${r.fields_filled} of 8 fields">${Array.from({ length: 8 }, (_, i) => `<i class="${i < r.fields_filled ? "on" : ""}"></i>`).join("")}</span> <span class="mono">${r.fields_filled}/8</span>` },
      { key: "fragment", label: "What the files contain", cls: "wrapcell" }, { key: "prompt", label: "What to write", cls: "wrapcell" }, { key: "depends_on", label: "Depends on" },
      { key: "confidence", label: "Confidence", render: r => confChip(r.confidence) }, { key: "flags", label: "Flags", render: r => flagChips(r.flags) }],
      filters: [{ label: "Category", get: r => r.category }, { label: "Flag", get: r => r.flags }],
      detail: r => dl([["Why this matters for hiring", r.why], ["Readiness", r.readiness], ["Sources", r.sources]]) });
  },
  research(el) {
    const inv = D.inventory;
    el.innerHTML = head("Research Topics", "What the folder covers and how deeply. Your own depth is unknown on every topic: there is no study log, quiz or filled mock scorecard.") +
      `<div class="block" id="t"></div><div class="block"><h3>Research gaps</h3><ol class="insights">${D.meta.research_gaps.map(g => `<li>${esc(g)}</li>`).join("")}</ol></div>
      <div class="view-head"><div><h2>Sources & coverage</h2><p>All ${inv.length} files: ${inv.filter(i => i.fully_read === "yes").length} read by eye, ${inv.filter(i => i.fully_read.startsWith("yes (")).length} verified by script, ${inv.filter(i => i.fully_read === "partial").length} partial, ${inv.filter(i => i.fully_read === "no").length} not readable or noise — each with the reason.</p></div></div>
      <div class="block" id="t2"></div><div class="block"><h3>Dropped as noise</h3><ol class="insights">${D.dropped.map(d => `<li><b style="color:var(--ink)">${esc(d.item)}</b> — ${esc(d.why)}</li>`).join("")}</ol></div>`;
    makeTable(el.querySelector("#t"), { id: "rt", rows: D.research, cols: [
      { key: "topic", label: "Topic", cls: "wrapcell" }, { key: "area", label: "Area" }, { key: "material_depth", label: "Material depth" }, { key: "your_depth", label: "Your depth" },
      { key: "key_facts", label: "Key facts", cls: "wrapcell" }, { key: "gap", label: "Gap", cls: "wrapcell" }, { key: "confidence", label: "Confidence", render: r => confChip(r.confidence) }, { key: "flags", label: "Flags", render: r => flagChips(r.flags) }],
      filters: [{ label: "Area", get: r => r.area }, { label: "Depth", get: r => r.material_depth }],
      detail: r => dl([["Why this matters for hiring", r.why], ["Sources", r.sources]]) });
    const rd = s => `<span class="chip ${s === "yes" ? "st-ok" : s.startsWith("yes") ? "st-mid" : s === "partial" ? "partial" : "no"}">${esc(s)}</span>`;
    makeTable(el.querySelector("#t2"), { id: "inv", rows: inv, cols: [
      { key: "name", label: "File", cls: "wrapcell" }, { key: "folder", label: "Folder", cls: "wrapcell" }, { key: "format", label: "Format" },
      { key: "size_bytes", label: "Size", cls: "num", sortVal: r => r.size_bytes, render: r => (r.size_bytes / 1024).toFixed(1) + " KB" }, { key: "count", label: "Pages / sheets / lines", cls: "num" },
      { key: "contents", label: "Contents", cls: "wrapcell" }, { key: "fully_read", label: "Fully read", render: r => rd(r.fully_read) }, { key: "how", label: "How / why not", cls: "wrapcell" }, { key: "contributes", label: "Contributed to", cls: "wrapcell" }],
      filters: [{ label: "Fully read", get: r => r.fully_read }, { label: "Format", get: r => r.format }, { label: "Top folder", get: r => r.folder.split("/")[0] }] });
  },
};
function head(t, p) { return `<div class="view-head"><div><h2>${esc(t)}</h2><p>${esc(p)}</p></div></div>`; }
function compCols() {
  return [{ key: "category", label: "Category" }, { key: "item", label: "Item", cls: "wrapcell" }, { key: "band", label: "Band", cls: "wrapcell" }, { key: "basis", label: "Basis", cls: "wrapcell" },
    { key: "date", label: "Date" }, { key: "source", label: "Source" }, { key: "confidence", label: "Confidence", render: r => confChip(r.confidence) }, { key: "flags", label: "Flags", render: r => flagChips(r.flags) }];
}

const TABS = [["dashboard", "Dashboard", ""], ["skilling", "Skilling", D.skills.length], ["portfolio", "Portfolio", D.projects.length], ["roles", "Roles Matrix", D.roles.length],
  ["jobs", "Job Search", D.pipeline.length], ["network", "Networking", D.networking.length], ["certs", "Certifications", D.certifications.length], ["stories", "Story Bank", D.stories.length], ["research", "Research Topics", D.research.length]];
const tl = document.getElementById("tablist"), main = document.getElementById("main"), done = new Set();
tl.innerHTML = TABS.map(([id, l, n]) => `<button class="tab" role="tab" id="tab-${id}" aria-controls="view-${id}" aria-selected="false" data-go="${id}">${l}${n !== "" ? `<span class="n">${n}</span>` : ""}</button>`).join("");
main.innerHTML = TABS.map(([id]) => `<section class="panel-view" id="view-${id}" role="tabpanel" aria-labelledby="tab-${id}" hidden></section>`).join("");
function go(id, scroll = true) {
  if (!VIEWS[id]) id = "dashboard";
  TABS.forEach(([t]) => { document.getElementById("tab-" + t).setAttribute("aria-selected", t === id); document.getElementById("view-" + t).hidden = t !== id; });
  if (!done.has(id)) { VIEWS[id](document.getElementById("view-" + id)); done.add(id); }
  try { history.replaceState(null, "", "#" + id); } catch (e) {}
  if (scroll) window.scrollTo({ top: 0 });
}
document.addEventListener("click", e => {
  const c = e.target.closest("[data-conf]");
  if (c) { e.stopPropagation(); go("dashboard", false); const t = document.getElementById("conf-" + c.dataset.conf); if (t) { document.getElementById("q-prio").value = ""; t.scrollIntoView({ block: "center" }); t.classList.remove("flash"); void t.offsetWidth; t.classList.add("flash"); } return; }
  const g = e.target.closest("[data-go]"); if (g) go(g.dataset.go);
});
tl.addEventListener("keydown", e => {
  if (!["ArrowRight", "ArrowLeft"].includes(e.key)) return;
  const ids = TABS.map(t => t[0]), cur = ids.indexOf(document.querySelector('.tab[aria-selected="true"]').dataset.go);
  const nx = ids[(cur + (e.key === "ArrowRight" ? 1 : ids.length - 1)) % ids.length]; go(nx); document.getElementById("tab-" + nx).focus();
});
const inv = D.inventory, k = s => inv.filter(i => i.fully_read === s).length;
document.getElementById("mastMeta").innerHTML = [["As of", D.meta.as_of], ["Files", inv.length], ["Read by eye", k("yes")], ["Script-verified", k("yes (script-verified)")],
  ["Partial", k("partial")], ["Not readable / noise", k("no")], ["Readiness", `${E.overall} / 100`]].map(([a, b]) => `<span>${a}</span><b>${esc(b)}</b>`).join("");
document.getElementById("foot").textContent = `${D.meta.owner} · built ${D.meta.as_of} from ${inv.length} files in D:\\ai apps dump\\research topic · ${R.formula}`;
go((location.hash || "#dashboard").slice(1), false);
})();
</script>
