[project]
name = "truthkeeper"
version = "0.1.0"
description = "Cross-system reconciliation agent: rules detect, the LLM explains, humans approve."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "anthropic>=2.0",
    "python-dotenv>=1.0",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "real: calls the real LLM API (skipped unless LLM_MODE=real and RUN_REAL_TESTS=1)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "data/generated", "data/sandbox"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
