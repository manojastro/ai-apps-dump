<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>EIR Console</title>
<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f9;color:#1b1f24}
 header{background:#12355b;color:#fff;padding:10px 20px;display:flex;gap:18px;align-items:center}
 header a{color:#cfe3ff;text-decoration:none} header .sp{flex:1}
 main{padding:20px;max-width:1100px;margin:auto}
 .card{background:#fff;border:1px solid #dde1e6;border-radius:8px;padding:14px;margin-bottom:12px}
 table{border-collapse:collapse;width:100%;background:#fff} th,td{border:1px solid #dde1e6;padding:6px 8px;text-align:left;font-size:14px}
 .tag{display:inline-block;padding:1px 8px;border-radius:10px;background:#e8eef7;font-size:12px}
 .banner{background:#fff4d6;border:1px solid #e6cf85;padding:8px 12px;border-radius:6px;margin-bottom:14px;font-size:13px}
 .untrusted{background:#fff0f0;border-left:3px solid #c33;padding:4px 8px;font-family:monospace;white-space:pre-wrap}
 button{padding:5px 12px;margin-right:6px} .denied{color:#b00020;font-weight:600}
</style></head><body>
<header><b>EIR Agent Fleet</b>
{% if user %}<a href="/approvals">Approvals</a><a href="/workflows">Workflows</a><a href="/audit">Audit</a>
{% if user.role == "nurse" %}<a href="/reviews">Review tasks</a>{% endif %}
<span class="sp"></span><span>{{ user.username }} ({{ user.role }})</span><a href="/logout">Logout</a>{% endif %}</header>
<main>
<div class="banner">Synthetic data only. Operations console: no clinical advice. Not for real patient use.</div>
{% block content %}{% endblock %}
</main></body></html>
