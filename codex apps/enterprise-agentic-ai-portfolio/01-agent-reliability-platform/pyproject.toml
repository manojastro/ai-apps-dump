[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-reliability-platform"
version = "0.1.0"
description = "Evidence-first AI agent evaluation and reliability control plane"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "pydantic==2.11.5",
  "uvicorn==0.41.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==8.3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["backend*"]
