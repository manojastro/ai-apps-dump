[project]
name = "kafka-streaming-reliability-agent"
version = "0.1.0"
description = "Local-first evidence-based Kafka incident investigation and remediation POC"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "pydantic==2.11.5",
  "uvicorn[standard]==0.41.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
