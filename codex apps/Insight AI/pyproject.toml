[project]
name = "productionlens"
version = "0.1.0"
description = "Agentic production investigation and evaluation"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.15,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "langgraph-checkpoint-sqlite>=3,<4",
  "redis>=5,<7",
  "rq>=2,<3",
  "pwdlib[argon2]>=0.2,<1",
  "itsdangerous>=2.2,<3",
  "prometheus-client>=0.26.0",
  "psutil>=7.2.2",
  "opentelemetry-sdk>=1.44.0",
  "opentelemetry-exporter-otlp-proto-http>=1.44.0",
  "opentelemetry-instrumentation-fastapi>=0.65b0",
  "opentelemetry-instrumentation-httpx>=0.65b0",
]
[dependency-groups]
dev = ["pytest>=8,<10", "playwright>=1.50,<2", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
