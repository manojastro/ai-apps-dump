[project]
name = "self-healing-remediation-agent"
version = "0.1.0"
description = "Policy-constrained AIOps remediation POC"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "langgraph>=0.2,<2",
  "PyYAML>=6,<7",
  "httpx>=0.27,<1",
  "kubernetes>=30,<35",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api", "."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.setuptools]
packages = ["app", "services", "services.agent", "services.policy", "services.tools"]

[tool.setuptools.package-dir]
app = "apps/api/app"
services = "services"
"services.agent" = "services/agent"
"services.policy" = "services/policy"
"services.tools" = "services/tools"
