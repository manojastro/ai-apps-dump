apiVersion: v1
kind: Namespace
metadata: {name: selfheal-demo, labels: {app.kubernetes.io/part-of: selfheal-poc}}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: selfheal-diagnostic-reader, namespace: selfheal-demo}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: selfheal-scoped-executor, namespace: selfheal-demo}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: diagnostic-reader, namespace: selfheal-demo}
rules:
  - apiGroups: ["", "apps", "batch"]
    resources: ["pods", "pods/log", "events", "deployments", "replicasets", "jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: diagnostic-reader, namespace: selfheal-demo}
subjects: [{kind: ServiceAccount, name: selfheal-diagnostic-reader, namespace: selfheal-demo}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: diagnostic-reader}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: scoped-executor, namespace: selfheal-demo}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: scoped-executor, namespace: selfheal-demo}
subjects: [{kind: ServiceAccount, name: selfheal-scoped-executor, namespace: selfheal-demo}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: scoped-executor}

