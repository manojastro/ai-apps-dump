[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-incident-rca"
version = "0.1.0"
description = "Evidence-grounded supervisor/worker incident RCA POC"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "langgraph>=0.2,<1",
  "prometheus-client>=0.20,<1",
  "neo4j>=5.23,<6",
  "psycopg[binary]>=3.2,<4",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires an external service such as Neo4j"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
