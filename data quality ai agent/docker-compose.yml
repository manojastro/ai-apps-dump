services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recoverygraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recoverygraph_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-recoverygraph}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-recoverygraph}:${POSTGRES_PASSWORD:-recoverygraph_local_only}@postgres:5432/${POSTGRES_DB:-recoverygraph}
      CHECKPOINT_URL: postgresql://${POSTGRES_USER:-recoverygraph}:${POSTGRES_PASSWORD:-recoverygraph_local_only}@postgres:5432/${POSTGRES_DB:-recoverygraph}
      ALLOWED_ORIGINS: '["http://localhost:${FRONTEND_PORT:-8080}","http://127.0.0.1:${FRONTEND_PORT:-8080}"]'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:${BACKEND_PORT:-8000}:8000'
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-8080}:8080'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.16.0
    profiles: [observability]
    ports:
      - '127.0.0.1:16686:16686'
      - '127.0.0.1:4318:4318'

volumes:
  postgres_data:
