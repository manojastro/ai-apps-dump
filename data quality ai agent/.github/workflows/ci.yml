name: Verify RecoveryGraph
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
      - run: uv run ruff check backend simulator evals
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv run python -m evals.run
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: uv run playwright install --with-deps chromium
      - name: Build and verify containers
        run: |
          docker compose up --build --wait --wait-timeout 180
          docker compose exec -T backend python scripts/postgres_smoke.py
          uv run python scripts/demo.py
          uv run python scripts/browser_smoke.py --url http://127.0.0.1:8080
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color --tail 150
      - name: Stop containers
        if: always()
        run: docker compose down
