apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: recoverygraph-backend
  template:
    metadata:
      labels:
        app: recoverygraph-backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: recoverygraph-backend:0.1.0
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: recoverygraph-config
            - secretRef:
                name: recoverygraph-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '2'
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: recoverygraph-backend
  ports:
    - port: 8000
      targetPort: 8000
