[project]
name = "network-twin-validation-agent"
version = "1.0.0"
description = "AI Network Digital Twin and Change Validation Agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "sqlalchemy>=2",
    "httpx",
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
dev-dependencies = []
