# SpreadLens canonical financial taxonomy (versioned). Non-financial companies only.
# section: where the item may legitimately appear; the mapper rewards matching sections and
# penalises mismatches so that "Borrowings" under current liabilities never maps to the
# non-current item by keyword alone.
# sign: "positive" = canonical value is a positive magnitude (expenses, assets);
#       "signed"   = may be negative by nature (profits, cash flows, net movement).
