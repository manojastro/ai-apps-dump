# Every hook:                  uv run pre-commit run --all-files
# Full git-history secret scan: uv run pre-commit run gitleaks-history --hook-stage manual
# (The default gitleaks hook scans only staged changes, which is what a commit needs.)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets (full git history)
        entry: gitleaks git --redact --verbose
        stages: [manual]

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, project environment)
        entry: uv run --frozen mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: forbid-env-files
        name: Forbid committing .env files
        entry: ".env files hold secrets and must never be committed; put placeholders in .env.example"
        language: fail
        files: '(^|/)\.env(\.[^/]+)?$'
        exclude: '(^|/)\.env\.example$'
