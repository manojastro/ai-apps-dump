services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: datasentinel
      POSTGRES_PASSWORD: datasentinel
      POSTGRES_DB: datasentinel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datasentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: demo
      DATABASE_URL: postgresql+psycopg2://datasentinel:datasentinel@postgres:5432/datasentinel
      WAREHOUSE_PATH: /data/warehouse.duckdb
      CHECKPOINT_PATH: /data/checkpoints.sqlite
      LLM_PROVIDER: mock
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - sentineldata:/data
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  sentineldata:
