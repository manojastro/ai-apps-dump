[project]
name = "citation-guard"
version = "0.1.0"
description = "Verifies every cited claim in an LLM answer against its source (Stage 1 of the Jev decision layer)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk",
    "pydantic>=2",
    "typer",
    "rich",
    "rapidfuzz",
    "openai",
    "fastapi",
    "uvicorn",
    "pyyaml",
    "python-dotenv",
    "httpx",
]

[project.scripts]
citation-guard = "citation_guard.cli:app"

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["citation_guard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
