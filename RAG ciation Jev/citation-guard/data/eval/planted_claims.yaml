# Planted claims written by Claude (label_source: claude_draft). Each has a real section.
# label: supports | contradicts | says_nothing | fabricated
# Quotes for non-fabricated claims are copied exactly from RFC 7519.
claims:
  # ------------------------------------------------------------------ known-good (supports)
  - claim_id: p01
    label: supports
    section_id: "4.1.4"
    claim: The "exp" claim identifies the expiration time on or after which the JWT must not be accepted for processing.
    quote: The "exp" (expiration time) claim identifies the expiration time on or after which the JWT MUST NOT be accepted for processing.
  - claim_id: p02
    label: supports
    section_id: "4.1.1"
    note: Quote appears in all seven registered-claim sections; passage must come from 4.1.1.
    claim: Use of the "iss" claim is optional.
    quote: Use of this claim is OPTIONAL.
  - claim_id: p03
    label: supports
    section_id: "4.1.3"
    claim: If a principal processing a JWT does not identify itself with a value in a present "aud" claim, the JWT must be rejected.
    quote: If the principal processing the claim does not identify itself with a value in the "aud" claim when this claim is present, then the JWT MUST be rejected.
  - claim_id: p04
    label: supports
    section_id: "4.1.3"
    claim: When a JWT has exactly one audience, the "aud" value may be a single string instead of an array.
    quote: In the special case when the JWT has one audience, the "aud" value MAY be a single case-sensitive string containing a StringOrURI value.
  - claim_id: p05
    label: supports
    section_id: "4.1.5"
    claim: When processing "nbf", implementers may allow a small leeway, usually no more than a few minutes, for clock skew.
    quote: Implementers MAY provide for some small leeway, usually no more than a few minutes, to account for clock skew.
  - claim_id: p06
    label: supports
    section_id: "8"
    claim: Conforming JWT implementations must implement HMAC SHA-256 ("HS256") and "none".
    quote: only HMAC SHA-256 ("HS256") and "none" MUST be implemented by conforming JWT implementations
  - claim_id: p07
    label: supports
    section_id: "5.1"
    claim: If the "typ" header parameter is present, its value is recommended to be "JWT".
    quote: If present, it is RECOMMENDED that its value be "JWT" to indicate that this object is a JWT.
  - claim_id: p08
    label: supports
    section_id: "5.2"
    claim: When nested signing or encryption is used, the "cty" header parameter must be present with the value "JWT".
    quote: In the case that nested signing or encryption is employed, this Header Parameter MUST be present; in this case, the value MUST be "JWT"
  - claim_id: p09
    label: supports
    section_id: "6"
    claim: An Unsecured JWT uses the "alg" value "none" and the empty string as its JWS Signature value.
    quote: An Unsecured JWT is a JWS using the "alg" Header Parameter value "none" and with the empty string for its JWS Signature value
  - claim_id: p10
    label: supports
    section_id: "4"
    claim: JWT parsers must either reject JWTs with duplicate claim names or use a JSON parser that keeps only the lexically last duplicate member name.
    quote: JWT parsers MUST either reject JWTs with duplicate Claim Names or use a JSON parser that returns only the lexically last duplicate member name
  - claim_id: p11
    label: supports
    section_id: "11.2"
    claim: When both signing and encryption are needed, producers should normally sign the message first and then encrypt the result.
    quote: if both signing and encryption are necessary, normally producers should sign the message and then encrypt the result (thus encrypting the signature).
  - claim_id: p12
    label: supports
    section_id: "7.2"
    claim: Which algorithms may be used in a given context is an application decision.
    quote: Finally, note that it is an application decision which algorithms may be used in a given context.
  - claim_id: p13
    label: supports
    section_id: "4.1"
    claim: None of the registered claims is intended to be mandatory to use or implement in all cases.
    quote: None of the claims defined below are intended to be mandatory to use or implement in all cases
  - claim_id: p14
    label: supports
    section_id: "4"
    claim: Absent application-specific requirements, claims that an implementation does not understand must be ignored.
    quote: in the absence of such requirements, all claims that are not understood by implementations MUST be ignored.
  - claim_id: p15
    label: supports
    section_id: "4.3"
    claim: Private Claim Names are subject to collision and should be used with caution.
    quote: Unlike Public Claim Names, Private Claim Names are subject to collision and should be used with caution.
  - claim_id: p16
    label: supports
    section_id: "4.1.6"
    note: Wrong section cited (quote is in 4.1.7). Expect FOUND_ELSEWHERE, then judged.
    claim: The "jti" claim can be used to prevent a JWT from being replayed.
    quote: The "jti" claim can be used to prevent the JWT from being replayed.
  - claim_id: p17
    label: supports
    section_id: "2"
    claim: A NumericDate is a JSON number giving the seconds from 1970-01-01T00:00:00Z UTC, ignoring leap seconds.
    quote: A JSON numeric value representing the number of seconds from 1970-01-01T00:00:00Z UTC until the specified UTC date/time, ignoring leap seconds.
  - claim_id: p18
    label: supports
    section_id: "7.2"
    claim: If any of the validation steps fails, the JWT must be rejected.
    quote: If any of the listed steps fail, then the JWT MUST be rejected
  - claim_id: p19
    label: supports
    section_id: "4.1.3"
    note: Quote under 20 characters. Expect QUOTE_TOO_SHORT -> HUMAN_REVIEW.
    claim: A JWT whose audience does not match the processing principal must be rejected.
    quote: MUST be rejected

  # ------------------------------------------------------------------ contradictions (real quote, claim flipped)
  - claim_id: b01
    label: contradicts
    section_id: "4.1.1"
    note: OPTIONAL flipped to required.
    claim: The "iss" claim must be included in every JWT.
    quote: Use of this claim is OPTIONAL.
  - claim_id: b02
    label: contradicts
    section_id: "4.1.3"
    note: MUST be rejected flipped to may be accepted.
    claim: If the principal does not identify itself with a value in a present "aud" claim, the JWT may still be accepted.
    quote: If the principal processing the claim does not identify itself with a value in the "aud" claim when this claim is present, then the JWT MUST be rejected.
  - claim_id: b03
    label: contradicts
    section_id: "4.1.5"
    note: Reversed condition (after-or-equal flipped to before).
    claim: Processing the "nbf" claim requires the current date/time to be before the not-before date/time.
    quote: The processing of the "nbf" claim requires that the current date/time MUST be after or equal to the not-before date/time listed in the "nbf" claim.
  - claim_id: b04
    label: contradicts
    section_id: "5.2"
    note: NOT RECOMMENDED flipped to recommended.
    claim: In the normal case without nested signing or encryption, using the "cty" header parameter is recommended.
    quote: In the normal case in which nested signing or encryption operations are not employed, the use of this Header Parameter is NOT RECOMMENDED.
  - claim_id: b05
    label: contradicts
    section_id: "8"
    note: OPTIONAL flipped to required.
    claim: Support for encrypted JWTs is required for conforming implementations.
    quote: Support for encrypted JWTs is OPTIONAL.
  - claim_id: b06
    label: contradicts
    section_id: "11.2"
    note: Order reversed.
    claim: When both signing and encryption are needed, producers should normally encrypt the message first and then sign the result.
    quote: if both signing and encryption are necessary, normally producers should sign the message and then encrypt the result (thus encrypting the signature).
  - claim_id: b07
    label: contradicts
    section_id: "4"
    note: MUST be ignored flipped to must be rejected.
    claim: Claims that an implementation does not understand must cause the JWT to be rejected.
    quote: in the absence of such requirements, all claims that are not understood by implementations MUST be ignored.

  # ------------------------------------------------------------------ unsupported (real quote, claim adds facts)
  - claim_id: u01
    label: says_nothing
    section_id: "4.1.7"
    claim: The "jti" claim must be a UUID.
    quote: The "jti" (JWT ID) claim provides a unique identifier for the JWT.
  - claim_id: u02
    label: says_nothing
    section_id: "8"
    claim: HS256 must be implemented because it is the fastest of the JWA algorithms.
    quote: only HMAC SHA-256 ("HS256") and "none" MUST be implemented by conforming JWT implementations
  - claim_id: u03
    label: says_nothing
    section_id: "4.1.6"
    claim: The "iat" claim can be used to determine the age of a JWT, and recipients must reject JWTs older than 24 hours.
    quote: This claim can be used to determine the age of the JWT.
  - claim_id: u04
    label: says_nothing
    section_id: "4.2"
    claim: Registering a new Claim Name in the IANA "JSON Web Token Claims" registry is free and takes less than a week.
    quote: any new Claim Name should either be registered in the IANA "JSON Web Token Claims" registry
  - claim_id: u05
    label: says_nothing
    section_id: "4.1.2"
    claim: The "sub" claim must contain the subject's email address.
    quote: The subject value MUST either be scoped to be locally unique in the context of the issuer or be globally unique.
  - claim_id: u06
    label: says_nothing
    section_id: "11.2"
    claim: Signing before encrypting also makes the resulting JWT smaller.
    quote: if both signing and encryption are necessary, normally producers should sign the message and then encrypt the result (thus encrypting the signature).
  - claim_id: u07
    label: says_nothing
    section_id: "9"
    claim: The URN "urn:ietf:params:oauth:token-type:jwt" is registered for applications that declare content types using URIs, and it replaces the "application/jwt" media type.
    quote: '"urn:ietf:params:oauth:token-type:jwt" for use by applications that declare content types using URIs'

  # ------------------------------------------------------------------ fabricated quotes (text not in the RFC)
  - claim_id: f01
    label: fabricated
    section_id: "4.1.4"
    claim: The "exp" claim must not be more than 24 hours after the "iat" claim.
    quote: The "exp" claim MUST NOT be more than 24 hours after the "iat" claim.
  - claim_id: f02
    label: fabricated
    section_id: "8"
    claim: All JWTs must be signed with an asymmetric algorithm.
    quote: All JWTs MUST be signed using an asymmetric algorithm such as RS256.
  - claim_id: f03
    label: fabricated
    section_id: "8"
    note: Near-miss edit of a real quote ("none" swapped for "RS256"). Fuzzy score will be high; must still FAIL.
    claim: Conforming implementations must implement HS256 and RS256.
    quote: only HMAC SHA-256 ("HS256") and "RS256" MUST be implemented by conforming JWT implementations
  - claim_id: f04
    label: fabricated
    section_id: "4.1.3"
    claim: The "aud" claim is required.
    quote: Use of this claim is REQUIRED.
