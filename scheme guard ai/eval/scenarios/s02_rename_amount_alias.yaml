    column:mart.daily_revenue.revenue: breaking
    column:mart.customer_ltv.ltv: breaking
    visual:Sales Overview/Revenue by Day: breaking
    visual:Finance Reconciliation/Paid vs Ordered: breaking
    visual:Customer Health/LTV Distribution: breaking
