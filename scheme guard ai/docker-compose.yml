# SchemaGuard local stack.
#   core    : kafka (KRaft, single node), schema-registry, postgres       (~1.5-2 GB RAM)
#   app     : schemaguard api + ui containers (needs core)
#   airflow : airflow standalone, parses/runs demo_pipeline/dags          (+~1.5 GB RAM)
#   neo4j   : optional lineage store backend                              (+~1 GB RAM)
#
# Status: written but NOT verified on the build machine (Docker was not installed there).
# Nothing in the test suite needs these services; see docs/RUNBOOK.md.
name: schemaguard

services:
  postgres:
    profiles: ["core"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: schemaguard
      POSTGRES_PASSWORD: schemaguard   # local dev only
      POSTGRES_DB: schemaguard
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schemaguard -d schemaguard"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    profiles: ["core"]
    image: apache/kafka:3.9.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    mem_limit: 900m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  schema-registry:
    profiles: ["core"]
    image: confluentinc/cp-schema-registry:7.7.1
    depends_on:
      kafka: { condition: service_healthy }
    ports: ["8081:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xms128m -Xmx384m"
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    profiles: ["app"]
    build: { context: ., target: api }
    depends_on:
      postgres: { condition: service_healthy }
    env_file: [.env]
    environment:
      SCHEMAGUARD_DATABASE_URL: postgresql://schemaguard:schemaguard@postgres:5432/schemaguard
      SCHEMAGUARD_REGISTRY_URL: http://schema-registry:8081
    ports: ["8000:8000"]
    mem_limit: 768m

  worker:
    profiles: ["app"]
    build: { context: ., target: worker }
    depends_on:
      api: { condition: service_started }
    env_file: [.env]
    environment:
      SCHEMAGUARD_DATABASE_URL: postgresql://schemaguard:schemaguard@postgres:5432/schemaguard
      SCHEMAGUARD_REGISTRY_URL: http://schema-registry:8081
    network_mode: service:api   # worker reaches the API on localhost; sandbox subprocesses get no extra network
    mem_limit: 768m

  airflow:
    profiles: ["airflow"]
    image: apache/airflow:2.10.5-python3.12
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: "duckdb==1.1.3 fastavro==1.9.7"
      DEMO_PIPELINE_DIR: /opt/demo_pipeline
    volumes:
      - ./demo_pipeline:/opt/demo_pipeline
      - ./demo_pipeline/dags:/opt/airflow/dags
    ports: ["8080:8080"]
    mem_limit: 1600m

  neo4j:
    profiles: ["neo4j"]
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/schemaguard-local
      NEO4J_server_memory_heap_max__size: 512m
    ports: ["7474:7474", "7687:7687"]
    mem_limit: 1g

volumes:
  pgdata: {}
