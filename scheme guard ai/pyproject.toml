[project]
name = "schemaguard"
version = "0.1.0"
description = "Agent that detects upstream schema changes, traces column-level lineage, and proposes tested fixes behind human approval."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
  "langgraph==1.2.22",
  "langgraph-checkpoint-sqlite==3.1.3",
  "sqlglot==30.31.0",
  "fastavro==1.13.1",
  "networkx==3.7",
  "duckdb==2.0.0",
  "pydantic==2.14.3",
  "pydantic-settings>=2.6,<3",
  "pyyaml>=6.0,<7",
  "fastapi==0.163.1",
  "uvicorn>=0.32,<1",
  "httpx>=0.27,<1",
  "opentelemetry-api==1.45.2",
  "opentelemetry-sdk==1.45.2",
  "tenacity>=9.0,<10",
]

[project.optional-dependencies]
# psycopg is LGPL-3.0 (approved by the owner as an optional extra on 2026-11-15).
postgres = [
  "langgraph-checkpoint-postgres==3.2.1",
  "psycopg[binary]==3.3.9",
  "psycopg-pool>=3.2,<4",
]
kafka = ["confluent-kafka==2.16.1"]
ui = ["streamlit==1.67.0", "graphviz>=0.20,<1"]
llm = ["openai>=1.50,<3", "anthropic>=0.40,<1", "azure-identity>=1.19,<2"]
neo4j = ["neo4j>=5.20,<7"]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
  "mypy>=1.13,<3",
  "types-pyyaml",
]

[project.scripts]
schemaguard = "schemaguard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schemaguard"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["eval/results", ".sandbox"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"src/schemaguard/ui/app.py" = ["SIM102"]

[tool.mypy]
python_version = "3.12"
packages = ["schemaguard"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: needs docker services (postgres/kafka); skipped unless SCHEMAGUARD_INTEGRATION=1",
]

[tool.uv]
link-mode = "copy"
