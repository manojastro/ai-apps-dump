services:
  app:
    build:
      context: ./server
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - PORT=8080
      - PUBLIC_HOST=${PUBLIC_HOST:?PUBLIC_HOST is required}
      - AUDIT_PATH=/data/audit.jsonl
    volumes:
      - audit-data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PUBLIC_HOST=${PUBLIC_HOST:?PUBLIC_HOST is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./server/public:/srv/public:ro
      - caddy-data:/data
      - caddy-config:/config
      - audit-data:/data:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  audit-data:
  caddy-data:
  caddy-config:
