name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: revenueos
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: revenueos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U revenueos" --health-interval 5s
          --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://revenueos:ci-only@localhost:5432/revenueos_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.20"
      - run: uv sync --frozen --python 3.11
      - run: uv run ruff check .
      - run: uv run pytest
      - name: Copilot eval plumbing (no API calls)
        run: |
          uv run python -m scripts.build_all
          uv run python ../eval/run_eval.py --dry-run
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DEMO_USER_PASSWORD: ci-only-demo

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
