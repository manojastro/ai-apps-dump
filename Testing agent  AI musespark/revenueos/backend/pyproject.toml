[project]
name = "revenueos-backend"
version = "0.1.0"
description = "RevenueOS AI: revenue intelligence API, ML pipelines and copilot"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "sqlalchemy==2.0.40",
  "alembic==1.15.2",
  "psycopg[binary]==3.2.6",
  "pgvector==0.4.1",
  "pydantic==2.11.3",
  "pydantic-settings==2.9.1",
  "pandas==2.2.3",
  "numpy==2.1.3",
  "scikit-learn==1.6.1",
  "lightgbm==4.6.0",
  "shap==0.47.2",
  "joblib==1.4.2",
  "anthropic==2.6.0",
  "apscheduler==3.11.0",
  "pyjwt==2.10.1",
  "bcrypt==4.3.0",
  "python-dotenv==1.1.0",
]

[project.optional-dependencies]
mlflow = ["mlflow==2.22.0"]

[dependency-groups]
dev = [
  "pytest==8.3.5",
  "httpx==0.28.1",
  "ruff==0.11.8",
  "pgserver==0.1.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
