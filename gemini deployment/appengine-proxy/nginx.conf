worker_processes auto;
events { worker_connections 4096; }

http {
  # Logged so the client-IP extraction below can be checked against what
  # Google's front end actually sends.
  log_format hda '$remote_addr xff="$http_x_forwarded_for" real="$hda_client_ip" '
                 '"$request" $status $body_bytes_sent ${request_time}s';
  access_log /dev/stdout hda;
  error_log  /dev/stderr warn;

  server_tokens off;

  # Google's front end APPENDS "<client>, <front-end>" to whatever the client
  # sent, so everything before those two entries is attacker-controlled. The
  # real client is the second-to-last entry; a lone entry is the client itself.
  map $http_x_forwarded_for $hda_client_ip {
    "~(?<ip>[^,\s]+)\s*,\s*[^,\s]+\s*$" $ip;
    "~^\s*(?<ip>[^,\s]+)\s*$"           $ip;
    default                             $remote_addr;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  upstream hda_vm {
    # The VM's internal address: the hop stays inside the VPC.
    server 10.160.0.2:443;
    keepalive 16;
  }

  server {
    listen 8080;

    location = /liveness_check  { access_log off; return 200 "ok\n"; }
    location = /readiness_check { access_log off; return 200 "ok\n"; }

    location / {
      proxy_pass https://hda_vm;

      # Caddy only serves its own hostname and holds the certificate for it.
      proxy_set_header Host 34-93-60-206.sslip.io;
      proxy_ssl_server_name on;
      proxy_ssl_name 34-93-60-206.sslip.io;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 3;
      proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      # Caddy trusts X-Real-IP from private ranges only and turns it into the
      # single X-Forwarded-For entry the app's rate limiters read.
      proxy_set_header X-Real-IP         $hda_client_ip;
      proxy_set_header X-Forwarded-For   "";
      proxy_set_header X-Forwarded-Proto https;

      # Live sessions stream for as long as the support call lasts.
      proxy_read_timeout  3600s;
      proxy_send_timeout  3600s;
      proxy_buffering     off;
      proxy_request_buffering off;
      client_max_body_size 100m;
    }
  }
}
